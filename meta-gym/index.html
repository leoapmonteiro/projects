<title>TrilhaFit</title>
<style>
  :root{
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ec;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
    --accent:#eb6834; --accent-ink:#ffffff;
    --leo:#2a78d6; --joana:#1baf7a;
    --good:#0ca30c; --critical:#d03b3b;
    --brand-ink:#141311;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
      --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
      --accent:#d95926; --accent-ink:#ffffff;
      --leo:#3987e5; --joana:#199e70;
      --good:#0ca30c; --critical:#e66767;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
    --accent:#d95926; --accent-ink:#ffffff;
    --leo:#3987e5; --joana:#199e70;
    --good:#0ca30c; --critical:#e66767;
  }

  * { box-sizing: border-box; }
  html, body{ height:100%; margin:0; }
  body{
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .vizroot{
    min-height: 100%;
    padding-bottom: 48px;
  }
  .vizroot, .vizroot *{ -webkit-tap-highlight-color: transparent; }
  h1,h2,h3{ text-wrap: balance; margin: 0; }
  .display{
    font-family: "Archivo Black", "Arial Black", "Segoe UI Black", -apple-system, sans-serif;
    letter-spacing: -0.01em;
  }
  .num{ font-variant-numeric: tabular-nums; }
  .eyebrow{
    font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--muted);
  }
  a{ color: inherit; }
  button{ font: inherit; }
  .btn{
    appearance:none; border:1px solid var(--border); background: var(--surface);
    color: var(--ink); border-radius: 10px; padding: 10px 16px; font-weight:600;
    font-size: 14px; cursor:pointer; transition: transform .08s ease, background .15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary{ background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn-ghost{ background: transparent; }
  .btn-sm{ padding: 7px 12px; font-size: 12.5px; border-radius: 8px; }
  .btn-block{ width:100%; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }
  .chip{
    appearance:none; border:1px solid var(--border); background: var(--surface);
    color: var(--ink-2); border-radius: 999px; padding: 7px 13px; font-size: 13px;
    font-weight:600; cursor:pointer;
  }
  .chip[aria-pressed="true"]{ background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .chip:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap{ max-width: 640px; margin: 0 auto; padding: 0 16px; }
  .topbar{
    position: sticky; top:0; z-index: 20; background: color-mix(in srgb, var(--page) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  }
  .topbar-in{ display:flex; align-items:center; justify-content:space-between; padding: 12px 16px; max-width:640px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand-mark{
    width: 30px; height:30px; border-radius:8px; background: var(--brand-ink);
    display:flex; align-items:center; justify-content:center; padding:6px; flex:none;
  }
  .brand-mark svg{ width:100%; height:100%; display:block; }
  .brand-name{ font-size: 15px; font-weight:800; letter-spacing:-0.01em; }
  .whoami{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); }
  .whoami b{ color:var(--ink); }
  .switchlink{ background:none; border:none; color:var(--muted); font-size:12px; text-decoration:underline; cursor:pointer; padding:2px; }

  .nav{ display:flex; gap:6px; overflow-x:auto; padding:10px 16px 12px; max-width:640px; margin:0 auto; scrollbar-width:none; }
  .nav::-webkit-scrollbar{ display:none; }
  .nav a{
    flex: none; text-decoration:none; font-size:12.5px; font-weight:700; color: var(--ink-2);
    background: var(--surface); border:1px solid var(--border); padding:7px 12px; border-radius:999px;
  }

  section{ padding: 22px 0 0; }
  .card{
    background: var(--surface); border:1px solid var(--border); border-radius:16px;
    padding: 18px; margin-top: 12px;
  }
  .card-title{ font-size:15px; font-weight:800; margin: 0 0 2px; }
  .card-sub{ font-size:12.5px; color:var(--muted); margin: 0 0 14px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .col{ display:flex; flex-direction:column; gap:10px; }
  .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  @media (max-width:520px){ .grid2{ grid-template-columns:1fr; } }

  /* Hero */
  .hero{
    display:flex; align-items:center; gap:20px; padding:20px; border-radius:18px;
    background: var(--surface); border:1px solid var(--border);
  }
  .ring-wrap{ position:relative; flex:none; width:118px; height:118px; }
  .ring-wrap .ring-num{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-num .n{ font-size: 26px; font-weight:900; line-height:1; }
  .ring-num .d{ font-size: 10.5px; color:var(--muted); font-weight:700; margin-top:2px; }
  .hero-stats{ flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .hero-stats .h-year{ font-size: 12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .hero-stats .h-title{ font-size:19px; font-weight:800; }
  .hero-metrics{ display:flex; gap:16px; margin-top:2px; flex-wrap:wrap; }
  .hmetric .v{ font-size:16px; font-weight:800; }
  .hmetric .l{ font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }

  /* Checkin */
  .daybadge{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700;
    padding:6px 10px; border-radius:999px; margin-bottom:12px;
  }
  .daybadge.pending{ background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); }
  .daybadge.done{ background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); }
  .field-label{ font-size:12px; font-weight:700; color:var(--ink-2); margin: 12px 0 8px; text-transform:uppercase; letter-spacing:.03em; }
  .field-label:first-child{ margin-top:0; }
  input[type="text"], input[type="number"], select, textarea{
    width:100%; border:1px solid var(--border); background: var(--surface-2); color:var(--ink);
    border-radius:10px; padding:10px 12px; font-size:14.5px; font-family:inherit;
  }
  textarea{ resize: vertical; min-height:64px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .doneinfo{ display:flex; flex-direction:column; gap:4px; font-size:13.5px; color:var(--ink-2); }
  .doneinfo b{ color:var(--ink); }

  /* Compare cards */
  .pcard{ border-radius:14px; padding:16px; border:1px solid var(--border); background:var(--surface); }
  .pcard .pname{ font-weight:800; font-size:14.5px; display:flex; align-items:center; gap:8px; }
  .pdot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .pcard .pbig{ font-size:28px; font-weight:900; margin-top:8px; }
  .pcard .pgoal{ font-size:12px; color:var(--muted); font-weight:700; }
  .pcard .ptrack{ height:8px; border-radius:999px; background:var(--grid); margin-top:10px; overflow:hidden; }
  .pcard .pfill{ height:100%; border-radius:999px; }
  .pbadge{ display:inline-block; margin-top:10px; font-size:11px; font-weight:700; color:var(--muted); }

  /* Profile */
  .avatar-btn{ appearance:none; border:none; background:none; padding:0; cursor:pointer; flex:none; position:relative; }
  .avatar-btn::after{
    content:"✎"; position:absolute; right:-2px; bottom:-2px; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink); font-size:10px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--surface);
  }
  .profile-row{ display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  .profile-name{ font-weight:800; font-size:15px; }
  .profile-hint{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  /* Badges */
  .badges-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .badge{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:7px 12px;
    border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-2);
  }
  .badge.earned{ background:color-mix(in srgb, var(--accent) 16%, var(--surface)); color:var(--accent); border-color:transparent; }

  /* Heatmap */
  .heatmap-scroll{ overflow-x:auto; padding-bottom:6px; }
  .heatmap{ display:inline-flex; gap:3px; }
  .heatmap-week{ display:flex; flex-direction:column; gap:3px; }
  .heatmap-day{ width:11px; height:11px; border-radius:2px; background:var(--grid); }
  .heatmap-legend{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin-top:8px; }

  /* Insights automáticos */
  .insight-row{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; color:var(--ink-2); line-height:1.5; }
  .insight-row:last-child{ border-bottom:none; }
  .insight-icon{ flex:none; font-size:15px; }

  /* Partner activity + reactions */
  .activity-item{ padding:10px 0; border-bottom:1px solid var(--border); }
  .activity-item:last-child{ border-bottom:none; }
  .activity-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .activity-type{ font-size:13px; font-weight:700; }
  .activity-date{ font-size:11px; color:var(--muted); font-weight:700; }
  .activity-obs{ font-size:12.5px; color:var(--ink-2); font-style:italic; margin-top:4px; }
  .reactions-row{ display:flex; gap:6px; margin-top:8px; }
  .reaction-btn{
    appearance:none; border:1px solid var(--border); background:var(--surface-2); border-radius:999px;
    padding:4px 10px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:4px;
  }
  .reaction-btn[aria-pressed="true"]{ background:color-mix(in srgb, var(--accent) 18%, var(--surface)); border-color:transparent; }
  .reaction-count{ font-size:10.5px; color:var(--muted); font-weight:700; }

  .banner{
    display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:12px; font-size:13px; font-weight:600;
    background:color-mix(in srgb, var(--critical) 12%, var(--surface)); color:var(--critical); margin-bottom:12px;
  }

  /* Insights bars */
  .hbar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .hbar-row:last-child{ margin-bottom:0; }
  .hbar-label{ width:88px; flex:none; font-size:12.5px; color:var(--ink-2); font-weight:600; }
  .hbar-track{ flex:1; height:14px; background:var(--grid); border-radius:5px; overflow:hidden; }
  .hbar-fill{ height:100%; border-radius:5px; min-width:3px; }
  .hbar-value{ width:22px; flex:none; text-align:right; font-size:12.5px; font-weight:700; color:var(--ink-2); }

  .weekbars{ display:flex; align-items:flex-end; gap:6px; height:96px; }
  .weekbar{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; }
  .weekbar .wv{ font-size:10px; color:var(--muted); font-weight:700; }
  .weekbar .wb{ width:100%; max-width:22px; border-radius:4px 4px 2px 2px; background:var(--grid); }
  .weekbar .wl{ font-size:9.5px; color:var(--muted); margin-top:2px; }

  .linechart{ width:100%; height:auto; display:block; }
  .empty-hint{ font-size:13px; color:var(--muted); padding:10px 0; }

  /* Plan */
  .plantabs{ display:flex; gap:8px; margin-bottom:12px; }
  .planday{ border:1px solid var(--border); background:var(--surface-2); border-radius:12px; padding:12px; margin-bottom:8px; }
  .planday:last-child{ margin-bottom:0; }
  .planday .pdt{ font-weight:700; font-size:13.5px; margin-bottom:4px; }
  .planday .pdm{ font-size:12px; color:var(--muted); }
  .tiplist{ margin: 10px 0 0; padding-left: 18px; font-size:13px; color:var(--ink-2); line-height:1.6; }
  .disclaimer{ margin-top:12px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--border); padding-top:10px; line-height:1.5; }

  .history-item{ display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
  .history-item:last-child{ border-bottom:none; }
  .hdate{ flex:none; width:44px; text-align:center; }
  .hdate .dd{ font-size:16px; font-weight:800; line-height:1.1; }
  .hdate .mm{ font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; }
  .hinfo{ flex:1; min-width:0; }
  .htype{ font-size:13.5px; font-weight:700; }
  .hmeta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .hmuscles{ display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .htag{ font-size:10.5px; font-weight:700; color:var(--ink-2); background:var(--surface-2); border-radius:6px; padding:2px 7px; }
  .hobs{ font-size:12.5px; color:var(--ink-2); font-style:italic; margin-top:6px; line-height:1.4; }
  .hactions{ display:flex; flex-direction:column; gap:7px; align-items:flex-end; flex:none; padding-left:8px; }
  .hundo{ background:none; border:none; font-size:11.5px; font-weight:700; cursor:pointer; }
  .hundo.danger{ color:var(--critical); }
  .hundo.neutral{ color:var(--ink-2); }

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:var(--page); padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
    opacity:0; pointer-events:none; transition: opacity .2s ease, transform .2s ease; z-index:60; max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .overlay{
    position:fixed; inset:0; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:80; padding:20px;
  }
  .gate-card{
    background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:28px 24px;
    max-width:380px; width:100%; text-align:center;
  }
  .gate-mark{
    width:56px; height:56px; border-radius:14px; background:var(--brand-ink);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px; padding:12px;
  }
  .gate-mark svg{ width:100%; height:100%; display:block; }
  .gate-title{ font-size:20px; font-weight:900; margin-bottom:4px; }
  .gate-tagline{ font-size:12px; color:var(--accent); font-weight:600; font-style:italic; margin-bottom:16px; }
  .gate-sub{ font-size:13.5px; color:var(--ink-2); margin-bottom:22px; line-height:1.5; }
  .gate-pick{ display:flex; flex-direction:column; gap:10px; }
  .pickbtn{
    display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:14px;
    border:1px solid var(--border); background:var(--surface-2); cursor:pointer; text-align:left;
  }
  .pickbtn .av{ width:34px; height:34px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; }
  .pickbtn .pn{ font-weight:800; font-size:14.5px; }
  .pickbtn .ps{ font-size:11.5px; color:var(--muted); }

  details.plancard summary{ cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; }
  details.plancard summary::-webkit-details-marker{ display:none; }
  .chev{ transition: transform .15s ease; color:var(--muted); }
  details[open] .chev{ transform: rotate(90deg); }

  .footnote{ text-align:center; font-size:11.5px; color:var(--muted); padding:26px 16px 6px; line-height:1.6; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>

  function dateFromStr(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtDDMM(s){ var d=dateFromStr(s); var MS=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"]; return { dd:pad(d.getDate()), mm:MS[d.getMonth()] }; }

  function weekMonday(dateStr){
    var d = dateFromStr(dateStr);
    var day = (d.getDay()+6)%7;

  function computeStats(who){
    var p = person(who);
    var goal = p.profile.goal || DEFAULT_GOAL;
    var checkins = p.checkins.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    var count = checkins.length;
    var pct = Math.min(1, count / goal);

    // streak (current, counting back from today/yesterday)
    var dates = {};
    checkins.forEach(function(c){ dates[c.date]=true; });
    var streak = 0;
    var cursor = new Date();
    var cursorStr = todayStr();
    if(!dates[cursorStr]){
      cursor.setDate(cursor.getDate()-1);
      cursorStr = cursor.getFullYear()+"-"+pad(cursor.getMonth()+1)+"-"+pad(cursor.getDate());
    }
    while(dates[cursorStr]){
      streak++;
      cursor.setDate(cursor.getDate()-1);
      cursorStr = cursor.getFullYear()+"-"+pad(cursor.getMonth()+1)+"-"+pad(cursor.getDate());
    }

    // best streak ever (longest run of consecutive dates in the whole history)
    var sortedDates = Object.keys(dates).sort();
    var bestStreak = 0, run = 0, prevD = null;
    sortedDates.forEach(function(ds){
      if(prevD){
        var expect = dateFromStr(prevD); expect.setDate(expect.getDate()+1);
        var expectStr = expect.getFullYear()+"-"+pad(expect.getMonth()+1)+"-"+pad(expect.getDate());
        run = (expectStr === ds) ? run+1 : 1;
      } else { run = 1; }
      if(run>bestStreak) bestStreak = run;
      prevD = ds;
    });

    var year = new Date().getFullYear();
    var deadline = new Date(year,11,31);
    var now = new Date();
    var daysLeft = Math.max(0, Math.ceil((deadline - now)/86400000));
    var weeksLeft = Math.max(1, Math.ceil(daysLeft/7));
    var remaining = Math.max(0, goal - count);
    var pace = remaining>0 ? (remaining/weeksLeft) : 0;

    // last time each muscle group was trained (days ago) — feeds the imbalance insight
    var muscleLastDate = {};
    checkins.forEach(function(c){ (c.musculos||[]).forEach(function(m){
      if(!muscleLastDate[m] || c.date > muscleLastDate[m]) muscleLastDate[m] = c.date;
    }); });

    // weekly buckets (last 8 weeks)
    var weekKeys = [];
    var wm = weekMonday(todayStr());
    for(var i=7;i>=0;i--){
      var d = dateFromStr(wm);
      d.setDate(d.getDate()-7*i);
      weekKeys.push(d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()));
    }
    var weekCounts = {};
    checkins.forEach(function(c){ var k=weekMonday(c.date); weekCounts[k]=(weekCounts[k]||0)+1; });
    var weekly = weekKeys.map(function(k){ return { key:k, label:fmtDDMM(k).dd+"/"+fmtDDMM(k).mm.slice(0,3), value: weekCounts[k]||0 }; });

    // muscles
    var muscleCounts = {};
    checkins.forEach(function(c){ (c.musculos||[]).forEach(function(m){ muscleCounts[m]=(muscleCounts[m]||0)+1; }); });
    var muscles = Object.keys(muscleCounts).map(function(k){ return {label:k, value:muscleCounts[k]}; }).sort(function(a,b){ return b.value-a.value; });

    // gyms
    var gymCounts = {};
    checkins.forEach(function(c){ if(c.academia){ gymCounts[c.academia]=(gymCounts[c.academia]||0)+1; } });
    var gyms = Object.keys(gymCounts).map(function(k){ return {label:k, value:gymCounts[k]}; }).sort(function(a,b){ return b.value-a.value; });

    // weight
    var weight = checkins.filter(function(c){ return c.peso && !isNaN(parseFloat(c.peso)); })
      .map(function(c){ return { date:c.date, value: parseFloat(c.peso) }; });

    var lastDate = checkins.length ? checkins[checkins.length-1].date : null;

    return { count:count, goal:goal, pct:pct, streak:streak, bestStreak:bestStreak, daysLeft:daysLeft, weeksLeft:weeksLeft,
      remaining:remaining, pace:pace, weekly:weekly, muscles:muscles, gyms:gyms, weight:weight, lastDate:lastDate,
      year:year, datesSet:dates, muscleLastDate:muscleLastDate, checkins:checkins };
  }

  var BADGE_DEFS = [

  function daysSince(dateStr){
    var d = dateFromStr(dateStr);
    return Math.round((dateFromStr(todayStr()) - d) / 86400000);
  }

  var FATIGUE_WORDS = ["dor","dolorid","cansaç","cansad","exaust","lesão","lesao","desânimo","desanimo","fraca","fraco","sem energia"];

  function computeInsights(stats){
    var out = [];

    // muscle imbalance: groups never trained (with enough history to matter) or stale >10 days
    if(stats.count >= 4){
      var TRACKED = ["Peito","Costas","Perna","Ombro","Glúteo","Core"];
      var stale = TRACKED.filter(function(m){
        var last = stats.muscleLastDate[m];
        return !last || daysSince(last) > 10;
      });
      if(stale.length){
        out.push({ icon:"⚖️", text:"Sem treinar "+stale.join(", ")+" há mais de 10 dias — pode valer encaixar no próximo treino." });
      }
    }

    // recent fatigue mentions in the diary
    var recentObs = stats.checkins.filter(function(c){ return daysSince(c.date) <= 14; });
    var fatigueHits = recentObs.filter(function(c){
      var t = (c.obs||"").toLowerCase();
      return FATIGUE_WORDS.some(function(w){ return t.indexOf(w) > -1; });
    });
    if(recentObs.length >= 3 && fatigueHits.length >= Math.ceil(recentObs.length/2)){
      out.push({ icon:"🛌", text:"Seus relatos das últimas 2 semanas mencionam cansaço/dor com frequência — pode ser hora de um dia de descanso extra." });
    }

    // weight trend
    if(stats.weight.length >= 2){
      var first = stats.weight[0], last = stats.weight[stats.weight.length-1];
      var delta = last.value - first.value;
      if(Math.abs(delta) >= 0.5){
        out.push({ icon: delta<0 ? "📉" : "📈", text:"Peso "+(delta<0?"caiu":"subiu")+" "+Math.abs(delta).toFixed(1).replace(".",",")+" kg desde o primeiro registro." });
      }
    }

    // pace vs recent reality
    var recentWeekly = stats.weekly.slice(-4);
    var recentAvg = recentWeekly.reduce(function(a,w){ return a+w.value; },0) / (recentWeekly.length||1);
    if(stats.remaining > 0 && stats.pace > recentAvg + 0.5){
      out.push({ icon:"⏱️", text:"O ritmo necessário ("+stats.pace.toFixed(1).replace(".",",")+"/semana) está acima da sua média recente ("+recentAvg.toFixed(1).replace(".",",")+"/semana)." });
    }

    if(stats.bestStreak >= 3){
      out.push({ icon:"✨", text:"Sua melhor sequência até agora foi de "+stats.bestStreak+" dias seguidos." });
    }

    if(!out.length){
      out.push({ icon:"👀", text:"Ainda sem padrões claros — continue registrando que os insights aparecem aqui." });
    }
    return out;
  }

  function heatmapCells(datesSet, year){
    var start = new Date(year,0,1);
    var startDow = (start.getDay()+6)%7; // Monday-first
    var gridStart = new Date(start); gridStart.setDate(gridStart.getDate()-startDow);
    var end = new Date(year,11,31);
    var cells = [];
    var d = new Date(gridStart);
    while(d <= end || cells.length % 7 !== 0){
      var ds = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
      cells.push({ date:ds, inYear: d.getFullYear()===year, trained: !!datesSet[ds] });
      d.setDate(d.getDate()+1);
      if(d > end && cells.length % 7 === 0) break;
    }
    var weeks = [];
    for(var i=0;i<cells.length;i+=7){ weeks.push(cells.slice(i,i+7)); }
    return weeks;
  }

  function compressImage(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("read failed")); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("decode failed")); };
        img.onload = function(){
          var size = 240;
          var canvas = document.createElement("canvas");
          canvas.width = size; canvas.height = size;
          var ctx = canvas.getContext("2d");
          var side = Math.min(img.width, img.height);
          var sx = (img.width-side)/2, sy = (img.height-side)/2;
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function ringSVG(pct, color, size, stroke){
    size = size||118; stroke = stroke||11;
    var r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-Math.max(0,Math.min(pct,1)));
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-hidden="true">'+
      '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--grid)" stroke-width="'+stroke+'"/>'+
      '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')" style="transition:stroke-dashoffset .5s ease"/>'+
    '</svg>';
  }

  function hbars(data, color, opts){
    opts = opts || {};
    if(!data.length) return '<p class="empty-hint">'+(opts.emptyText||"Sem dados ainda.")+'</p>';
    var max = Math.max.apply(null, data.map(function(d){ return d.value; }));
    return data.slice(0, opts.limit||9).map(function(d){
      var pct = Math.round((d.value/max)*100);
      return '<div class="hbar-row">'+
        '<div class="hbar-label">'+escapeHtml(d.label)+'</div>'+
        '<div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
        '<div class="hbar-value num">'+d.value+'</div>'+
      '</div>';
    }).join('');
  }

  function weekBars(weekly, color){
    var max = Math.max(1, Math.max.apply(null, weekly.map(function(w){ return w.value; })));
    return '<div class="weekbars">' + weekly.map(function(w){
      var h = Math.round((w.value/max)*100);
      return '<div class="weekbar">'+
        '<div class="wv num">'+(w.value||"")+'</div>'+
        '<div class="wb" style="height:'+Math.max(h,3)+'%;'+(w.value? 'background:'+color+';' : '')+'" title="'+w.label+': '+w.value+' treino(s)"></div>'+
        '<div class="wl">'+w.label+'</div>'+
      '</div>';
    }).join('') + '</div>';
  }

  function weightLine(weight, color){
    if(weight.length < 2){
      return '<p class="empty-hint">Registre o peso em pelo menos 2 marcações para ver a curva.</p>';
    }
    var w=560, h=120, pad=18;
    var vals = weight.map(function(p){return p.value;});
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(min===max){ min -= 1; max += 1; }
    var stepX = (w - pad*2) / (weight.length-1);
    function y(v){ return pad + (h-pad*2) * (1 - (v-min)/(max-min)); }
    var pts = weight.map(function(p,i){ return [pad + i*stepX, y(p.value)]; });
    var path = pts.map(function(p,i){ return (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
    var area = path + " L"+pts[pts.length-1][0].toFixed(1)+","+(h-pad)+" L"+pts[0][0].toFixed(1)+","+(h-pad)+" Z";
    var first = weight[0], last = weight[weight.length-1];
    var delta = (last.value - first.value);
    var deltaLabel = (delta>0?"+":"") + delta.toFixed(1).replace(".", ",") + " kg desde " + fmtDDMM(first.date).dd+"/"+fmtDDMM(first.date).mm.slice(0,3);
    var gridLines = [0.25,0.5,0.75].map(function(f){ var gy=pad+(h-pad*2)*f; return '<line x1="'+pad+'" y1="'+gy+'" x2="'+(w-pad)+'" y2="'+gy+'" stroke="var(--grid)" stroke-width="1"/>'; }).join("");
    return '<svg class="linechart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Evolução de peso">'+
      gridLines +
      '<path d="'+area+'" fill="'+color+'" opacity="0.12" stroke="none"/>'+
      '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<circle cx="'+pts[pts.length-1][0]+'" cy="'+pts[pts.length-1][1]+'" r="4.5" fill="'+color+'"><title>'+last.value+' kg</title></circle>'+
    '</svg>'+
    '<div style="display:flex;justify-content:space-between;margin-top:6px;">'+
      '<span style="font-size:12px;color:var(--muted);">'+first.value.toFixed(1).replace(".",",")+' kg</span>'+
      '<span style="font-size:13px;font-weight:800;">'+last.value.toFixed(1).replace(".",",")+' kg</span>'+
    '</div>'+
    '<div style="font-size:11.5px;color:var(--muted);text-align:right;">'+deltaLabel+'</div>';
  }

  function wireEvents(me){
    var app = document.getElementById("app");

    var switchBtn = document.getElementById("btn-switch");
    if(switchBtn) switchBtn.addEventListener("click", function(){
      if(confirm("Trocar o usuário deste aparelho? Use apenas se este celular for compartilhado — normalmente cada pessoa usa o próprio celular.")){
        clearIdentity();
        identity = null;
        render();
      }
    });

    app.querySelectorAll("[data-quick]").forEach(function(el){
      el.addEventListener("click", function(){
        var v = el.getAttribute("data-quick");
        var plan = PLANS[person(me).profile.plano||"A"];
        if(v==="cardio"){
          var ci = draft.musculos.indexOf("Cardio");
          if(ci>-1) draft.musculos.splice(ci,1); else draft.musculos.push("Cardio");
        }
        else if(v==="outro"){ draft.tipo="Outro"; }
        else{
          var d = plan.dias[+v];
          draft.tipo = d.label;
          draft.musculos = d.musculos.slice();
        }
        render();
      });
    });

    app.querySelectorAll("[data-muscle]").forEach(function(el){
      el.addEventListener("click", function(){
        var m = el.getAttribute("data-muscle");
        var i = draft.musculos.indexOf(m);
        if(i>-1) draft.musculos.splice(i,1); else draft.musculos.push(m);
        render();
      });
    });

    app.querySelectorAll("[data-gym]").forEach(function(el){
      el.addEventListener("click", function(){
        var g = el.getAttribute("data-gym");
        if(g==="__outra"){ draft.showCustomGym = !draft.showCustomGym; draft.academia = null; }
        else { draft.academia = g; draft.showCustomGym = false; }
        render();
      });
    });

    var gymCustom = document.getElementById("gym-custom");
    if(gymCustom) gymCustom.addEventListener("input", function(){ draft.academiaCustom = gymCustom.value; });

    var togglePeso = document.getElementById("btn-toggle-peso");
    if(togglePeso) togglePeso.addEventListener("click", function(){ draft.showPeso = !draft.showPeso; render(); });

    var pesoInput = document.getElementById("peso-input");
    if(pesoInput) pesoInput.addEventListener("input", function(){ draft.peso = pesoInput.value; });

    var obsInput = document.getElementById("obs-input");
    if(obsInput) obsInput.addEventListener("input", function(){ draft.obs = obsInput.value; });

    var submitBtn = document.getElementById("btn-submit");
    if(submitBtn) submitBtn.addEventListener("click", function(){ submitCheckin(me); });

    var undoBtn = document.getElementById("btn-undo");
    if(undoBtn) undoBtn.addEventListener("click", function(){ undoToday(me); });

    app.querySelectorAll("[data-undo]").forEach(function(el){
      el.addEventListener("click", function(){ undoById(me, el.getAttribute("data-undo")); });
    });

    app.querySelectorAll("[data-edit]").forEach(function(el){
      el.addEventListener("click", function(){ startEdit(me, el.getAttribute("data-edit")); });
    });

    var cancelEditBtn = document.getElementById("btn-cancel-edit");
    if(cancelEditBtn) cancelEditBtn.addEventListener("click", function(){ cancelEdit(); });

    app.querySelectorAll("[data-plan]").forEach(function(el){
      el.addEventListener("click", function(){
        var planId = el.getAttribute("data-plan");
        var p = person(me);
        p.profile.plano = planId;
        p.profile.planOpen = true;
        saveCache();
        cloudUpdate(ROOT+"/"+me+"/profile", { plano: planId, planOpen: true });
        render();
      });
    });

    var shareBtn = document.getElementById("btn-share");
    if(shareBtn) shareBtn.addEventListener("click", function(){ shareProgress(me); });

    var backupBtn = document.getElementById("btn-backup");
    if(backupBtn) backupBtn.addEventListener("click", function(){ downloadBackup(); });

    var avatarBtn = document.getElementById("btn-avatar");
    var photoInput = document.getElementById("photo-input");
    if(avatarBtn && photoInput) avatarBtn.addEventListener("click", function(){ photoInput.click(); });
    if(photoInput) photoInput.addEventListener("change", function(){
      var file = photoInput.files && photoInput.files[0];
      if(!file) return;
      if(file.size > 8*1024*1024){ toast("Imagem muito grande — escolha uma foto menor."); return; }
      compressImage(file).then(function(dataUrl){
        var p = person(me);
        p.profile.photo = dataUrl;
        saveCache();
        cloudUpdate(ROOT+"/"+me+"/profile", { photo: dataUrl });
        toast("Foto atualizada!");
        render();
      }).catch(function(){ toast("Não foi possível usar essa imagem — tente outra."); });
    });

    var saveGoalBtn = document.getElementById("btn-save-goal");
    if(saveGoalBtn) saveGoalBtn.addEventListener("click", function(){
      var goalInput = document.getElementById("goal-input");
      var v = parseInt(goalInput.value, 10);
      if(!v || v<1){ toast("Digite uma meta válida."); return; }
      var p = person(me);
      p.profile.goal = v;
      saveCache();
      cloudUpdate(ROOT+"/"+me+"/profile", { goal: v });
      toast("Meta atualizada!");
      render();
    });

    app.querySelectorAll("[data-react]").forEach(function(el){
      el.addEventListener("click", function(){
        var parts = el.getAttribute("data-react").split("|");
        var owner = parts[0], checkinId = parts[1], emoji = parts[2];
        var p = person(owner);
        var c = p.checkins.find(function(x){ return x.id === checkinId; });
        if(!c) return;
        if(!c.reactions) c.reactions = {};
        var current = c.reactions[me];
        if(current === emoji){ delete c.reactions[me]; cloudRemove(ROOT+"/"+owner+"/checkins/"+checkinId+"/reactions/"+me); }
        else { c.reactions[me] = emoji; cloudSet(ROOT+"/"+owner+"/checkins/"+checkinId+"/reactions/"+me, emoji); }
        saveCache();
        render();
      });
    });
  }

  function resetDraft(){
    draft = { tipo:null, musculos:[], academia:null, academiaCustom:"", peso:"", obs:"", showPeso:false, showCustomGym:false };
  }

  function submitCheckin(me){
    var academia = draft.showCustomGym ? draft.academiaCustom.trim() : draft.academia;
    var tipoLabel = draft.tipo || (draft.musculos.length ? draft.musculos.join(" + ") : "");
    var obs = draft.obs.trim();
    if(!academia){ toast("Escolha a academia."); return; }
    if(draft.musculos.length===0){ toast("Selecione ao menos um grupo muscular."); return; }
    if(!tipoLabel){ toast("Escolha o tipo de treino ou os grupos musculares."); return; }
    if(!obs){ toast("Conta como foi o treino — isso vira o diário de vocês."); return; }

    var p = person(me);

    if(editing){
      var idx = p.checkins.findIndex(function(c){ return c.id === editing.id; });
      var original = idx>-1 ? p.checkins[idx] : null;
      var updated = {
        id: editing.id,
        date: editing.date,
        tipoLabel: tipoLabel,
        musculos: draft.musculos.slice(),
        academia: academia,
        peso: draft.peso ? String(parseFloat(draft.peso)) : "",
        obs: obs,
        ts: (original && original.ts) ? original.ts : new Date().toISOString()
      };
      if(idx>-1) p.checkins[idx] = updated; else p.checkins.push(updated);
      saveCache();
      cloudSet(ROOT+"/"+me+"/checkins/"+editing.id, updated);
      editing = null;
      resetDraft();
      toast("Treino atualizado!");
      render();
      return;
    }

    var entry = {
      id: uid(),
      date: todayStr(),
      tipoLabel: tipoLabel,
      musculos: draft.musculos.slice(),
      academia: academia,
      peso: draft.peso ? String(parseFloat(draft.peso)) : "",
      obs: obs,
      ts: new Date().toISOString()
    };
    p.checkins.push(entry);
    saveCache();
    cloudSet(ROOT+"/"+me+"/checkins/"+entry.id, entry);
    resetDraft();
    toast("Treino registrado! 💪");
    render();
  }

  function startEdit(me, id){
    var p = person(me);
    var c = p.checkins.find(function(x){ return x.id === id; });
    if(!c) return;
    var isKnownGym = GYMS.indexOf(c.academia) > -1;
    draft = {
      tipo: c.tipoLabel || null,
      musculos: (c.musculos || []).slice(),
      academia: isKnownGym ? c.academia : null,
      academiaCustom: isKnownGym ? "" : (c.academia || ""),
      peso: c.peso || "",
      obs: c.obs || "",
      showPeso: !!c.peso,
      showCustomGym: !isKnownGym && !!c.academia
    };
    editing = { id: c.id, date: c.date };
    render();
    var card = document.getElementById("checkin-card");
    if(card) card.scrollIntoView({ behavior:"smooth", block:"start" });
  }

  function cancelEdit(){
    editing = null;
    resetDraft();
    render();
  }

  function undoToday(me){
    var e = todayEntry(me);
    if(!e) return;
    undoById(me, e.id);
  }
  function undoById(me, id){
    if(!confirm("Remover esse treino marcado?")) return;
    var p = person(me);
    p.checkins = p.checkins.filter(function(c){ return c.id !== id; });
    saveCache();
    cloudRemove(ROOT+"/"+me+"/checkins/"+id);
    if(editing && editing.id === id){ editing = null; resetDraft(); }
    toast("Treino removido.");
    render();
  }

  function shareProgress(me){
    var stats = computeStats(me);
    var text = "💪 TrilhaFit — progresso de "+PEOPLE[me].name+"\n"+
      "✅ "+stats.count+"/"+stats.goal+" treinos em "+stats.year+"\n"+
      "🔥 Sequência atual: "+stats.streak+" dia(s)\n"+
      "📅 Faltam "+stats.daysLeft+" dias para o fim do ano\n\n"+
      "Acompanhe no TrilhaFit:\n"+APP_URL;

    if(navigator.share){
      navigator.share({ title:"TrilhaFit", text:text }).catch(function(err){
        if(err && err.name === "AbortError") return;
        copyToClipboard(text);
      });
    } else {
      copyToClipboard(text);
    }
  }

  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("Copiado! Cole no grupo do WhatsApp."); }).catch(function(){ window.prompt("Copie o texto abaixo e cole no grupo:", text); });
    } else {
      window.prompt("Copie o texto abaixo e cole no grupo:", text);
    }
  }

  function downloadBackup(){
    var data = { exportedAt: new Date().toISOString(), leo: db.leo, joana: db.joana };
    var json = JSON.stringify(data, null, 2);
    if(downloadsCap){
      downloadsCap.save({ filename:"meta-gym-backup.json", data: json })
        .then(function(){ toast("Backup salvo!"); })
        .catch(function(err){
          if(err && err.code === "declined"){ return; }
          toast("Não foi possível salvar o backup agora.");
        });
      return;
    }
    var blob = new Blob([json], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "meta-gym-backup.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast("Backup salvo!");
  }

  // ---------- init ----------
  render();
  startCloudSync();
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads").then(function(cap){
      downloadsCap = cap;
      downloadsBlocked = !cap;
      var btn = document.getElementById("btn-backup");
      if(btn){ btn.disabled = downloadsBlocked; btn.textContent = downloadsBlocked ? "Backup indisponível nesta visualização" : "Baixar backup (JSON)"; }
    }).catch(function(){});
  }
</script>
</body>
</html>
